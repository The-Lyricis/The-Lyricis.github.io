name: Deploy React Site
on:
  push:
    branches: [master] # 确认对应你的分支名
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4 
        with:
          node-version: 20
          cache: 'npm'
      - run: npm install
      - name: Sync Steam library
        run: |
          if [ -n "$STEAM_API_KEY" ] && [ -n "$STEAM_ID" ]; then
            npm run sync:steam
          else
            echo "Steam secrets are not configured; using the committed snapshot."
          fi
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
          STEAM_FILTER_LIBRARY: 'true'
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './build' # 必须与 vite.config.ts 中的 outDir 一致
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

